<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mbrt · chat to a map</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Chat to a map. Type a place, a route or a drive time and watch it drawn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #E9EBED; --ink2: rgba(233, 235, 237, 0.62); --muted: rgba(233, 235, 237, 0.38);
      --hair: rgba(255, 255, 255, 0.084); --glass: rgba(10, 12, 15, 0.65); --field: rgba(255, 255, 255, 0.05);
      --cyan: #089bdf; --good: #5fae6b; --warn: #B8860B; --bad: #B8564A;
      --font: "Quantico", ui-monospace, monospace;
      --bar-h: 150px;
    }
    * { box-sizing: border-box; border-radius: 0; }
    html, body { margin: 0; height: 100%; background: #0b0d10; color: var(--ink); font: 13px/1.4 var(--font); }
    #map { position: fixed; inset: 0; }
    .glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); }
    .cap, label > span, #log b, dt { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink2); }

    /* top-left wordmark and the tools toggle */
    #top { position: fixed; top: 12px; left: 12px; z-index: 3; display: flex; gap: 6px; align-items: stretch; }
    .mark { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 7px; }
    .mark svg { display: block; }

    /* tools: an overlay on the map, opened from the top-left */
    #tools { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(360px, 92vw); max-height: 70vh; overflow-y: auto; z-index: 4; padding: 12px; }
    body:not(.tools-open) #tools { display: none; }
    #desc { color: var(--ink2); margin: 6px 0 10px; }
    label { display: block; margin-bottom: 8px; }
    label > span { display: block; margin-bottom: 3px; }
    label i { color: var(--muted); font-style: normal; }
    #tools input, #tools select, #tools textarea, #tools button { font: 13px/1.3 var(--font); color: var(--ink); background: var(--field); border: 1px solid var(--hair); }
    #tools input, #tools select, #tools textarea { width: 100%; padding: 6px 7px; }
    select option { background: #15181c; }
    textarea { resize: vertical; }
    #tools input:focus, #tools select:focus, #tools textarea:focus { outline: 1px solid var(--cyan); outline-offset: -1px; }
    .row { display: flex; gap: 6px; margin-top: 4px; }
    .row button { flex: 1; cursor: pointer; padding: 8px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; }
    #run { background: var(--ink); color: #0b0d10; border-color: var(--ink); }
    #run:disabled { opacity: 0.5; cursor: wait; }

    /* the feed, written onto the map above the bar: labels right of a center axis, text left of it */
    #feed { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 10px); width: min(760px, 94vw); max-height: 42vh; overflow-y: auto;
      z-index: 2; pointer-events: none; scrollbar-width: none; user-select: none; -webkit-user-select: none; text-shadow: 0 1px 2px #000, 0 0 10px #000, 0 0 18px rgba(0, 0, 0, 0.8); }
    body:not(.has-feed) #feed { display: none; }
    #log { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 3px; }
    #log li { display: contents; }
    #log b, #log span, #chart { pointer-events: auto; transition: opacity 1.2s ease; }
    #log b { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink2); padding-top: 2px; }
    #log span { text-align: left; font-variant-numeric: tabular-nums; }
    #log small { display: block; font-size: 10px; color: var(--muted); }
    #log .step.ok b { color: var(--good); }
    #log .step.warn b { color: var(--warn); }
    #log .step.bad b { color: var(--bad); }
    #log .head b, #log .result b, #log .json b { display: none; }
    #log .head span, #log .result span, #log .json span { grid-column: 1 / -1; text-align: center; }
    #log .head span { font-weight: 700; font-size: 18px; text-transform: uppercase; color: #fff; margin-bottom: 4px; }
    #log .result span { font-weight: 700; font-size: 22px; color: #fff; margin-top: 4px; }
    #log .result.warn span { color: #e2b44f; }
    #log .pick b { color: var(--cyan); }
    #log .pick b, #log .pick span { cursor: pointer; }
    #log .json span { display: none; font-size: 11px; color: var(--muted); word-break: break-word; }
    #log .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; grid-column: 1 / -1; margin-top: 6px; }
    #log .chips button { pointer-events: auto; cursor: pointer; font: 12px/1.3 var(--font); color: var(--ink); padding: 5px 10px; text-shadow: none;
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); }
    #log .chips button:hover { border-color: var(--cyan); color: #fff; }
    #log .json.open span { display: block; }
    #chart { margin: 6px auto 0; width: min(420px, 100%); background: var(--glass); border: 1px solid var(--hair); text-shadow: none; }
    #chart svg { display: block; width: 100%; height: 80px; }
    #chart polygon { fill: rgba(255, 255, 255, 0.1); }
    #chart polyline { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    #chart dl { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; padding: 6px 7px; border-top: 1px solid var(--hair); }
    #chart dd { margin: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
    #chart dt { grid-row: 1; }
    /* settled: steps fade, your message and the result stay, errors stay; hovering the feed brings it all back */
    .settled #log .step:not(.bad) > *, .settled #log .pick > *, .settled #log .json > * { opacity: 0; }
    .settled #feed:hover #log > li > * { opacity: 1; }

    /* the chat bar, carried over from the first mbrt: frosted, big, centered, an orb while thinking */
    #chat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 6vh 1vh calc(6vh + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); }
    #chat .field { position: relative; z-index: 1; }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #chat .field::before { display: none; } /* the shader layer replaces the css orb */
    #chat .field::before { content: ""; position: absolute; top: 50%; left: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(8, 155, 223, 0.2) 0%, rgba(8, 155, 223, 0) 70%); border-radius: 50%; filter: blur(20px);
      opacity: 0; pointer-events: none; z-index: -1; transition: opacity 0.3s; }
    #chat .field.thinking::before { opacity: 1; animation: orbFloat 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes orbFloat {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(1); filter: blur(20px); }
      20% { transform: translate(-50%, -50%) translate(2px, -3px) scale(1.05); filter: blur(22px); }
      40% { transform: translate(-50%, -50%) translate(-3px, 2px) scale(0.95); filter: blur(18px); }
      60% { transform: translate(-50%, -50%) translate(3px, 1px) scale(1.08); filter: blur(24px); }
      80% { transform: translate(-50%, -50%) translate(-2px, -2px) scale(0.98); filter: blur(19px); }
      100% { transform: translate(-50%, -50%) translate(0, 0) scale(1); filter: blur(20px); }
    }
    #msg { width: 100%; padding: 0; font: 700 30px var(--font); text-transform: uppercase; text-align: center;
      color: white; background: transparent; border: 0; outline: none; transition: color 0.3s; }
    #msg::placeholder { color: rgba(255, 255, 255, 0.6); opacity: 0.5; }
    #msg:focus::placeholder { opacity: 0.28; } /* still shows the example, so Tab can take it */
    #msg.thinking, #msg.thinking::placeholder { color: #089bdf7e; opacity: 1; }
    #msg.shake { animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes shake { 15% { transform: translateX(-10px); } 30% { transform: translateX(8px); } 45% { transform: translateX(-5px); } 60% { transform: translateX(3px); } 75% { transform: translateX(-1px); } 100% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { #msg.shake { animation: none; } }
    #cancel-notice { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); opacity: 0; transition: opacity 0.3s ease; }
    #cancel-notice.visible { opacity: 1; }

    /* credits: one line of small text above the bar */
    #map .maplibregl-ctrl-bottom-right { bottom: calc(var(--bar-h) + 4px); }
    #map .maplibregl-ctrl.maplibregl-ctrl-attrib { background: none; margin: 0 10px 6px; padding: 0; font: 8px/1.4 var(--font); color: rgba(233, 235, 237, 0.4); text-shadow: 0 0 3px #000;
      max-width: min(360px, 70vw); text-align: right; }
    #map .maplibregl-ctrl-attrib a { color: inherit; }
    #map .maplibregl-ctrl-attrib-button { display: none; }
    /* zoom and compass in the same glass as everything else */
    #map .maplibregl-ctrl.maplibregl-ctrl-group { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--hair); border-radius: 0; box-shadow: none; overflow: hidden; }
    #map .maplibregl-ctrl-group button { width: 32px; height: 32px; background: transparent; }
    #map .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair); }
    #map .maplibregl-ctrl-group button:not(:disabled):hover { background: rgba(255, 255, 255, 0.08); }
    #map .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); opacity: 0.85; }
    #map .maplibregl-ctrl-group button:disabled .maplibregl-ctrl-icon { opacity: 0.3; }
    #map .maplibregl-ctrl-top-right { top: 2px; right: 2px; }
    body:not(.turned) #map .maplibregl-ctrl-compass { display: none; }
    #map .maplibregl-ctrl-group .gear-btn { display: grid; place-items: center; color: var(--ink); }
    #map .maplibregl-ctrl-group .gear-btn[aria-pressed="true"] { color: var(--cyan); }
    #map .maplibregl-ctrl-group .basemap-btn { font: 700 9px var(--font); letter-spacing: 0.08em; color: var(--ink); }
    #map .maplibregl-ctrl-bottom-left { bottom: calc(var(--bar-h) + 4px); }
    #map .maplibregl-ctrl.maplibregl-ctrl-scale { background: none; margin: 0 0 6px 12px; padding: 0 4px; border: 1px solid var(--ink2); border-top: 0;
      font: 9px/1.6 var(--font); color: var(--ink); text-shadow: 0 0 4px #000, 0 0 2px #000; transition: opacity 0.4s; }
    /* on the zoomed-out globe one scale bar is only true at the center, so it shows from zoom 5 */
    body.globe-view #map .maplibregl-ctrl-scale { opacity: 0; }

    @media (max-width: 700px) {
      #chat { padding: 3vh 16px calc(3vh + env(safe-area-inset-bottom)); }
      #msg { font-size: 20px; }

    }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="top"><span class="mark glass" aria-label="mbrt"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9V3h6M23 3h6v6M29 23v6h-6M9 29H3v-6" fill="none" stroke="#e9ebed" stroke-width="1.8"/><rect x="25.4" y="3" width="3.6" height="3.6" fill="#089BDF"/><path d="M9.5 23V11h13v12M16 11v12" fill="none" stroke="#e9ebed" stroke-width="3.4"/></svg><svg height="17" viewBox="-24 -809 2993 918" aria-hidden="true"><path d="M674 0V-462H672L514 0H381L222 -468H220V0H85V-700H271L447 -185H449L624 -700H809V0ZM1505 -413 1418 -363V-361L1505 -311V-67L1389 0H1010V-700H1389L1505 -633ZM1150 -302V-120H1365V-302ZM1150 -580V-422H1365V-580ZM2237 0H2083L1933 -264H1846V0H1706V-700H2085L2201 -633V-331L2085 -264ZM1846 -580V-384H2061V-580ZM2671 -580V0H2531V-580H2342V-700H2860V-580Z" fill="#08080c" stroke="#d9e2df" stroke-width="109" paint-order="stroke" stroke-linejoin="miter"/><path d="M674 0V-462H672L514 0H381L222 -468H220V0H85V-700H271L447 -185H449L624 -700H809V0ZM1505 -413 1418 -363V-361L1505 -311V-67L1389 0H1010V-700H1389L1505 -633ZM1150 -302V-120H1365V-302ZM1150 -580V-422H1365V-580ZM2237 0H2083L1933 -264H1846V0H1706V-700H2085L2201 -633V-331L2085 -264ZM1846 -580V-384H2061V-580ZM2671 -580V0H2531V-580H2342V-700H2860V-580Z" fill="none" stroke="#08080c" stroke-width="38" stroke-linejoin="miter"/></svg></span></header>
  <section id="tools" class="glass">
    <form id="form" autocomplete="off">
      <label><span>tool</span><select id="tool"></select></label>
      <p id="desc"></p>
      <fieldset id="fields" style="border:0;margin:0;padding:0"></fieldset>
      <div class="row"><button id="run" type="submit">Run</button><button id="clear" type="button">Clear</button></div>
    </form>
  </section>
  <section id="feed">
    <ol id="log"></ol>
    <div id="chart" hidden></div>
  </section>
  <form id="chat" autocomplete="off">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="field">
      <span id="cancel-notice">sending this will cancel the current request</span>
      <input id="msg" placeholder="Ask the map anything" maxlength="500" aria-label="Ask the map">
    </div>
  </form>
  <script type="module" src="./main.js"></script>
</body>
</html>
