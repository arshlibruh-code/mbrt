<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mbrt · chat to a map</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Chat to a map. Type a place, a route or a drive time and watch it drawn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #E9EBED; --ink2: rgba(233, 235, 237, 0.62); --muted: rgba(233, 235, 237, 0.38);
      --hair: rgba(255, 255, 255, 0.084); --glass: rgba(10, 12, 15, 0.65); --field: rgba(255, 255, 255, 0.05);
      --cyan: #089bdf; --good: #5fae6b; --warn: #B8860B; --bad: #B8564A;
      --font: "Quantico", ui-monospace, monospace;
      --bar-h: 150px;
    }
    * { box-sizing: border-box; border-radius: 0; }
    html, body { margin: 0; height: 100%; background: #0b0d10; color: var(--ink); font: 13px/1.4 var(--font); }
    #map { position: fixed; inset: 0; }
    .glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); }
    .cap, label > span, #log b, dt { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink2); }

    /* top-left wordmark and the tools toggle */
    #top { position: fixed; top: 12px; left: 12px; z-index: 3; display: flex; gap: 6px; align-items: stretch; }
    .mark { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 7px; }
    .mark svg { display: block; }

    /* the panel: a sheet docked left (the map slides right to stay in view), a bottom sheet on phones */
    #tools { position: fixed; top: 54px; left: 12px; max-height: calc(100vh - 54px - var(--bar-h) - 12px); width: 340px; z-index: 4; display: flex; flex-direction: column;
      transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
    body:not(.tools-open) #tools { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
    .ptabs { display: flex; border-bottom: 1px solid var(--hair); flex: none; }
    .ptabs button { flex: 1; padding: 10px 0 9px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
      color: var(--ink2); font: 700 10px var(--font); letter-spacing: .14em; text-transform: uppercase; }
    .ptabs button:hover { color: var(--ink); }
    .ptabs i { font-style: normal; color: var(--muted); font-weight: 400; }
    #tools[data-tab="tool"] .ptabs [data-tab="tool"], #tools[data-tab="layers"] .ptabs [data-tab="layers"],
    #tools[data-tab="brain"] .ptabs [data-tab="brain"], #tools[data-tab="map"] .ptabs [data-tab="map"] { color: #fff; border-bottom-color: var(--cyan); }
    #tools-close { flex: 0 0 36px; font: 18px/1 var(--font); letter-spacing: 0; }
    .ppane { flex: 1; min-height: 0; overflow: hidden auto; padding: 12px; scrollbar-width: thin; }
    #tools:not([data-tab="tool"]) [data-pane="tool"], #tools:not([data-tab="layers"]) [data-pane="layers"],
    #tools:not([data-tab="brain"]) [data-pane="brain"], #tools:not([data-tab="map"]) [data-pane="map"] { display: none; }
    #pfoot { flex: none; border: 0; border-top: 1px solid var(--hair); background: none; padding: 8px 12px; text-align: left; cursor: pointer; color: var(--muted);
      font: 10px var(--font); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pfoot:hover { color: var(--cyan); }
    #desc { color: var(--ink2); margin: 10px 0 12px; min-height: 18px; font-size: 12px; }
    #desc b { color: #fff; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-right: 6px; }
    #desc em { float: right; font-style: normal; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
    #tiles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; }
    .tile { display: grid; place-items: center; height: 36px; padding: 0; margin-left: -1px; cursor: pointer; color: var(--ink2);
      background: var(--field); border: 1px solid var(--hair); }
    .tile:hover { color: var(--ink); }
    .tile[aria-pressed="true"] { color: #fff; border-color: var(--cyan); background: rgba(8, 155, 223, 0.12); position: relative; }
    .field { margin-bottom: 10px; }
    .flabel { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .flabel span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
    .flabel i { font-style: normal; font-size: 10px; color: var(--muted); }
    .stop { display: grid; grid-template-columns: 14px 1fr 30px 22px; align-items: center; gap: 4px; margin-bottom: 4px; }
    .stop .found { grid-column: 2 / 5; }
    .aim { width: 30px; height: 30px; flex: none; display: grid; place-items: center; cursor: crosshair; color: var(--muted); background: var(--field); border: 1px solid var(--hair); padding: 0; }
    .aim:hover, .aim[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }
    body.picking #map .maplibregl-canvas { cursor: crosshair; }
    #pick-hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5; padding: 6px 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
    body:not(.picking) #pick-hint { display: none; }
    .numchips { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px; min-height: 32px; background: var(--field); border: 1px solid var(--hair); }
    .numchips:focus-within { outline: 1px solid var(--cyan); outline-offset: -1px; }
    .nchip { display: flex; gap: 5px; align-items: baseline; padding: 3px 6px; cursor: pointer; color: #fff; background: rgba(8, 155, 223, 0.16); border: 1px solid rgba(8, 155, 223, 0.5); font: 12px var(--font); font-variant-numeric: tabular-nums; }
    .nchip i { font-style: normal; color: var(--muted); }
    .nchip:hover i { color: #fff; }
    #tools .numchips .nadd { flex: 1; min-width: 50px; width: auto; border: 0; background: none; padding: 3px 4px; outline: none; }
    .numchips b { padding-right: 6px; }
    .reach .unitrow .seg { flex: 0 0 96px; }
    #run { width: 100%; margin-top: 6px; border: 1px solid var(--ink); padding: 10px 8px; cursor: pointer; font: 700 11px var(--font); letter-spacing: .12em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hintline { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
    #layers { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    #layers:empty { display: none; }
    #layers:not(:empty) + #no-layers { display: none; }
    .layer { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; background: var(--field); border: 1px solid var(--hair); cursor: pointer; }
    .layer:hover { border-color: rgba(255, 255, 255, 0.2); }
    .layer.sel { border-color: var(--cyan); background: rgba(8, 155, 223, 0.1); }
    .layer.off { opacity: 0.45; }
    .layer > svg { color: var(--ink2); }
    .layer .what { min-width: 0; }
    .layer .what b { display: block; font-weight: 400; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layer .what small { display: block; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .layer .acts { display: flex; gap: 2px; }
    .layer .acts button { width: 24px; height: 24px; display: grid; place-items: center; padding: 0; background: none; border: 0; color: var(--muted); cursor: pointer; font: 13px var(--font); }
    .layer .acts button:hover { color: #fff; }
    .brain-btn.wide { width: 100%; }
    #m-go { flex: 0 0 52px; }
    .grip { color: var(--muted); cursor: grab; font-size: 11px; letter-spacing: -2px; user-select: none; }
    .stop .x, .more { background: none; border: 0; color: var(--muted); cursor: pointer; font: 14px var(--font); }
    .stop .x:hover, .more:hover { color: #fff; }
    .more { font-size: 11px; letter-spacing: .06em; padding: 2px 0; }
    .found { display: block; font-size: 10.5px; color: var(--muted); margin: 2px 0 0 2px; min-height: 0; }
    .found.ok { color: var(--good); }
    .found.bad { color: var(--bad); }
    .unitrow { display: flex; gap: 4px; align-items: center; }
    .unitrow input { flex: 1; }
    .unitrow b { flex: none; font-size: 11px; color: var(--ink2); letter-spacing: .08em; text-transform: uppercase; }
    .seg { display: flex; gap: 0; }
    .seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px; cursor: pointer; color: var(--ink2);
      background: var(--field); border: 1px solid var(--hair); margin-left: -1px; font: 11px var(--font); letter-spacing: .06em; }
    .seg button[aria-pressed="true"] { color: #fff; border-color: var(--cyan); background: rgba(8, 155, 223, 0.12); position: relative; }
    .mapaction .sub { margin-top: 6px; }
    label { display: block; margin-bottom: 8px; }
    label > span { display: block; margin-bottom: 3px; }
    label i { color: var(--muted); font-style: normal; }
    #tools input, #tools select, #tools textarea, #tools .row button { font: 13px/1.3 var(--font); color: var(--ink); background: var(--field); border: 1px solid var(--hair); }
    #tools input, #tools select { width: 100%; padding: 6px 7px; }
    select option { background: #15181c; }
    textarea { resize: vertical; }
    #tools input:focus, #tools select:focus, #tools textarea:focus { outline: 1px solid var(--cyan); outline-offset: -1px; }
    .row { display: flex; gap: 6px; margin-top: 4px; }
    .row button { flex: 1; cursor: pointer; padding: 8px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; }
    #run { background: var(--ink); color: #0b0d10; border-color: var(--ink); }
    #run:disabled { opacity: 0.5; cursor: wait; }
    #brain .seg button, #tools [data-pane="map"] .seg button { text-transform: uppercase; font-size: 10px; letter-spacing: .1em; }
    .brain-pane { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .brain-pane .found { margin: 0; }
    .brain-btn { cursor: pointer; padding: 7px 8px; font: 700 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--field); border: 1px solid var(--hair); }
    .brain-btn:hover { border-color: var(--cyan); color: #fff; }

    /* the feed, written onto the map above the bar: labels right of a center axis, text left of it */
    #feed { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 10px); width: min(760px, 94vw); max-height: 42vh; overflow-y: auto;
      z-index: 2; pointer-events: none; scrollbar-width: none; user-select: none; -webkit-user-select: none; text-shadow: 0 1px 2px #000, 0 0 10px #000, 0 0 18px rgba(0, 0, 0, 0.8); }
    body:not(.has-feed) #feed { display: none; }
    #log { display: flex; flex-direction: column; gap: 12px; }
    .turn { transform-origin: 50% 100%; transition: opacity 0.45s, transform 0.45s; animation: turnIn 0.35s ease-out; }
    .turn[data-age="1"] { opacity: 0.55; transform: scale(0.95); }
    .turn[data-age="2"] { opacity: 0.28; transform: scale(0.9); }
    .turn:hover { opacity: 1; transform: none; }
    @keyframes turnIn { from { opacity: 0; transform: translateY(14px); } }
    .turn .lines { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 3px; }
    #log li { display: contents; }
    #log b, #log span, .chart { pointer-events: auto; transition: opacity 1.2s ease; }
    #log b { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink2); padding-top: 2px; }
    #log span { text-align: left; font-variant-numeric: tabular-nums; }
    #log small { display: block; font-size: 10px; color: var(--muted); }
    #log .step.ok b { color: var(--good); }
    #log .step.warn b { color: var(--warn); }
    #log .step.bad b { color: var(--bad); }
    #log .head b, #log .result b, #log .json b { display: none; }
    #log .head span, #log .result span, #log .json span { grid-column: 1 / -1; text-align: center; }
    #log .head span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); margin-bottom: 2px; }
    #log .result span { font-weight: 700; font-size: 21px; color: #fff; margin-top: 3px; }
    #log .result.warn span { color: #e2b44f; }
    #log .pick b { color: var(--cyan); }
    #log .pick b, #log .pick span { cursor: pointer; }
    #log .json span { display: none; font-size: 11px; color: var(--muted); word-break: break-word; }
    #log .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; grid-column: 1 / -1; margin-top: 6px; }
    #log .chips button { pointer-events: auto; cursor: pointer; font: 12px/1.3 var(--font); color: var(--ink); padding: 5px 10px; text-shadow: none;
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); }
    #log .chips button:hover { border-color: var(--cyan); color: #fff; }
    #log .chips button svg { vertical-align: -1px; margin-right: 5px; }
    #log .json.open span { display: block; }
    .chart { margin: 6px auto 0; width: min(420px, 100%); background: var(--glass); border: 1px solid var(--hair); text-shadow: none; }
    .chart svg { display: block; width: 100%; height: 80px; }
    .chart polygon { fill: rgba(255, 255, 255, 0.1); }
    .chart polyline { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .chart dl { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; padding: 6px 7px; border-top: 1px solid var(--hair); }
    .chart dd { margin: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
    .chart dt { grid-row: 1; }
    /* settled: steps fade, your message and the result stay, errors stay; hovering the feed brings it all back */
    .turn.settled .step:not(.bad) > *, .turn.settled .pick > *, .turn.settled .json > * { opacity: 0; }
    .turn.settled:hover .lines > li > * { opacity: 1; }

    /* the chat bar, carried over from the first mbrt: frosted, big, centered, an orb while thinking */
    #chat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 6vh 1vh calc(6vh + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); }
    #chat .field { position: relative; z-index: 1; }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #chat .field::before { display: none; } /* the shader layer replaces the css orb */
    #chat .field::before { content: ""; position: absolute; top: 50%; left: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(8, 155, 223, 0.2) 0%, rgba(8, 155, 223, 0) 70%); border-radius: 50%; filter: blur(20px);
      opacity: 0; pointer-events: none; z-index: -1; transition: opacity 0.3s; }
    #chat .field.thinking::before { opacity: 1; animation: orbFloat 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes orbFloat {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(1); filter: blur(20px); }
      20% { transform: translate(-50%, -50%) translate(2px, -3px) scale(1.05); filter: blur(22px); }
      40% { transform: translate(-50%, -50%) translate(-3px, 2px) scale(0.95); filter: blur(18px); }
      60% { transform: translate(-50%, -50%) translate(3px, 1px) scale(1.08); filter: blur(24px); }
      80% { transform: translate(-50%, -50%) translate(-2px, -2px) scale(0.98); filter: blur(19px); }
      100% { transform: translate(-50%, -50%) translate(0, 0) scale(1); filter: blur(20px); }
    }
    #msg { width: 100%; padding: 0; font: 700 30px var(--font); text-transform: uppercase; text-align: center;
      color: white; background: transparent; border: 0; outline: none; transition: color 0.3s; }
    #msg::placeholder { color: rgba(255, 255, 255, 0.6); opacity: 0.5; }
    #msg:focus::placeholder { opacity: 0.28; } /* still shows the example, so Tab can take it */
    #msg.thinking, #msg.thinking::placeholder { color: #089bdf7e; opacity: 1; }
    #msg.shake { animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes shake { 15% { transform: translateX(-10px); } 30% { transform: translateX(8px); } 45% { transform: translateX(-5px); } 60% { transform: translateX(3px); } 75% { transform: translateX(-1px); } 100% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { #msg.shake { animation: none; } }
    #tools-open { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); z-index: 2; width: 38px; height: 38px; display: grid; place-items: center;
      cursor: pointer; color: rgba(255, 255, 255, 0.55); background: var(--glass); border: 1px solid var(--hair); }
    #tools-open:hover, #tools-open[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }
    #cancel-notice { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); opacity: 0; transition: opacity 0.3s ease; }
    #cancel-notice.visible { opacity: 1; }

    /* credits: one line of small text above the bar */
    #map .maplibregl-ctrl-bottom-right { bottom: calc(var(--bar-h) + 4px); }
    #map .maplibregl-ctrl.maplibregl-ctrl-attrib { background: none; margin: 0 10px 6px; padding: 0; font: 8px/1.4 var(--font); color: rgba(233, 235, 237, 0.4); text-shadow: 0 0 3px #000;
      max-width: min(360px, 70vw); text-align: right; }
    #map .maplibregl-ctrl-attrib a { color: inherit; }
    #map .maplibregl-ctrl-attrib-button { display: none; }
    /* zoom and compass in the same glass as everything else */
    #map .maplibregl-ctrl.maplibregl-ctrl-group { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--hair); border-radius: 0; box-shadow: none; overflow: hidden; }
    #map .maplibregl-ctrl-group button { width: 32px; height: 32px; background: transparent; }
    #map .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair); }
    #map .maplibregl-ctrl-group button:not(:disabled):hover { background: rgba(255, 255, 255, 0.08); }
    #map .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); opacity: 0.85; }
    #map .maplibregl-ctrl-group button:disabled .maplibregl-ctrl-icon { opacity: 0.3; }
    #map .maplibregl-ctrl-top-right { top: 2px; right: 2px; }
    body:not(.turned) #map .maplibregl-ctrl-compass { display: none; }
    #map .maplibregl-ctrl-group .basemap-btn { font: 700 9px var(--font); letter-spacing: 0.08em; color: var(--ink); }
    #map .maplibregl-ctrl-bottom-left { bottom: calc(var(--bar-h) + 4px); }
    #map .maplibregl-ctrl.maplibregl-ctrl-scale { background: none; margin: 0 0 6px 12px; padding: 0 4px; border: 1px solid var(--ink2); border-top: 0;
      font: 9px/1.6 var(--font); color: var(--ink); text-shadow: 0 0 4px #000, 0 0 2px #000; transition: opacity 0.4s; }
    /* on the zoomed-out globe one scale bar is only true at the center, so it shows from zoom 5 */
    body.globe-view #map .maplibregl-ctrl-scale { opacity: 0; }

    @media (max-width: 700px) {
      #chat { padding: 3vh 16px calc(3vh + env(safe-area-inset-bottom)); }
      #msg { font-size: 20px; }
      #tools { top: auto; left: 0; right: 0; width: auto; bottom: var(--bar-h); max-height: 58vh; border-left: 0; border-right: 0; }
      body:not(.tools-open) #tools { transform: translateY(calc(100% + var(--bar-h))); }

    }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="top"><span class="mark glass" aria-label="mbrt"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9V3h6M23 3h6v6M29 23v6h-6M9 29H3v-6" fill="none" stroke="#e9ebed" stroke-width="1.8"/><rect x="25.4" y="3" width="3.6" height="3.6" fill="#089BDF"/><path d="M9.5 23V11h13v12M16 11v12" fill="none" stroke="#e9ebed" stroke-width="3.4"/></svg><svg height="17" viewBox="-24 -809 2993 918" aria-hidden="true"><path d="M674 0V-462H672L514 0H381L222 -468H220V0H85V-700H271L447 -185H449L624 -700H809V0ZM1505 -413 1418 -363V-361L1505 -311V-67L1389 0H1010V-700H1389L1505 -633ZM1150 -302V-120H1365V-302ZM1150 -580V-422H1365V-580ZM2237 0H2083L1933 -264H1846V0H1706V-700H2085L2201 -633V-331L2085 -264ZM1846 -580V-384H2061V-580ZM2671 -580V0H2531V-580H2342V-700H2860V-580Z" fill="#08080c" stroke="#d9e2df" stroke-width="109" paint-order="stroke" stroke-linejoin="miter"/><path d="M674 0V-462H672L514 0H381L222 -468H220V0H85V-700H271L447 -185H449L624 -700H809V0ZM1505 -413 1418 -363V-361L1505 -311V-67L1389 0H1010V-700H1389L1505 -633ZM1150 -302V-120H1365V-302ZM1150 -580V-422H1365V-580ZM2237 0H2083L1933 -264H1846V0H1706V-700H2085L2201 -633V-331L2085 -264ZM1846 -580V-384H2061V-580ZM2671 -580V0H2531V-580H2342V-700H2860V-580Z" fill="none" stroke="#08080c" stroke-width="38" stroke-linejoin="miter"/></svg></span></header>
  <aside id="tools" class="glass" data-tab="tool">
    <nav class="ptabs"><button type="button" data-tab="tool">tool</button><button type="button" data-tab="layers">layers <i id="layer-count"></i></button><button type="button" data-tab="brain">brain</button><button type="button" data-tab="map">map</button><button type="button" id="tools-close" title="close (esc)" aria-label="close panel">×</button></nav>
    <div class="ppane" data-pane="tool">
      <form id="form" autocomplete="off">
        <div id="tiles"></div>
        <p id="desc"></p>
        <div id="fields"></div>
        <button id="run" type="submit">Run</button>
      </form>
    </div>
    <div class="ppane" data-pane="layers">
      <ol id="layers"></ol>
      <p id="no-layers" class="hintline">Nothing on the map yet. Ask Theo, or run a tool.</p>
      <div class="row"><button id="export" type="button" title="download what is shown as GeoJSON">Export</button><button id="clear" type="button">Clear map</button></div>
    </div>
    <div class="ppane" data-pane="brain"><div id="brain"></div></div>
    <div class="ppane" data-pane="map">
      <div class="field"><div class="flabel"><span>basemap</span></div><div class="seg" id="m-base"><button type="button" data-v="satellite">sat</button><button type="button" data-v="dark">dark</button><button type="button" data-v="street">map</button></div></div>
      <div class="field"><div class="flabel"><span>terrain</span></div><div class="seg" id="m-terrain"><button type="button" data-v="off">flat</button><button type="button" data-v="on">3D</button></div></div>
      <div class="field"><div class="flabel"><span>go to</span><i>lat, lon</i></div><div class="unitrow"><input id="m-coords" placeholder="12.9716, 77.5946"><button type="button" class="brain-btn" id="m-go">go</button></div></div>
      <button type="button" class="brain-btn wide" id="m-locate">my location</button>
    </div>
    <button type="button" id="pfoot" title="choose the brain"></button>
  </aside>
  <div id="pick-hint" class="glass">click the map to pick a place · esc cancels</div>
  <section id="feed">
    <div id="log"></div>
  </section>
  <form id="chat" autocomplete="off">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="field">
      <span id="cancel-notice">sending this will cancel the current request</span>
      <input id="msg" placeholder="Ask the map anything" maxlength="500" aria-label="Ask the map">
    </div>
    <button type="button" id="tools-open" title="tools" aria-label="tools" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </form>
  <script type="module" src="./main.js"></script>
</body>
</html>
