<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mbrt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ground: #121518; --panel: #171B20; --panel2: #1D2126; --hair: #292F36;
      --ink: #E1E2E4; --ink2: #9199A4; --muted: #5D6673;
      --white: #F1F2F3; --soft: #BEC2C7; --link: #26A0D6;
      --good: #5fae6b; --warn: #B8860B; --bad: #B8564A;
      --serif: "Fraunces", Georgia, serif; --mono: "Share Tech Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; border-radius: 0; }
    html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--serif); font-variation-settings: "opsz" 14; }
    #map { position: fixed; inset: 0 0 0 330px; }
    #panel { position: fixed; inset: 0 auto 0 0; width: 330px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--hair); padding: 14px 14px 20px; }
    h1 { margin: 0; font-size: 26px; font-variation-settings: "opsz" 120; font-weight: 700; letter-spacing: -0.01em; }
    .sub, label > span, #log b, dt { font-size: 10px; font-variation-settings: "opsz" 9; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink2); }
    .sub { display: block; margin: 2px 0 14px; }
    .or { margin: 12px 0 8px; padding-top: 10px; border-top: 1px solid var(--hair); }
    #desc { color: var(--ink2); margin: 6px 0 10px; font-size: 13px; }
    label { display: block; margin-bottom: 8px; }
    label > span { display: block; margin-bottom: 3px; }
    label i { color: var(--muted); font-style: normal; }
    input, select, textarea, button { width: 100%; font: 13px/1.3 var(--mono); letter-spacing: -0.03em; color: var(--ink); background: var(--panel2); border: 1px solid var(--hair); padding: 6px 7px; }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--link); outline-offset: -1px; }
    .row { display: flex; gap: 6px; margin: 4px 0 10px; }
    button { cursor: pointer; font-family: var(--serif); font-variation-settings: "opsz" 9; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; padding: 8px; }
    #run { background: var(--white); color: var(--ground); border-color: var(--white); }
    #run:disabled { opacity: 0.5; cursor: wait; }
    #clear { width: 40%; }
    #call { margin: 0 0 8px; padding: 6px 7px; background: var(--ground); border: 1px solid var(--hair); font: 12px/1.35 var(--mono); letter-spacing: -0.04em; color: var(--soft); white-space: pre-wrap; word-break: break-word; }
    #call:empty { display: none; }
    #chart { margin-bottom: 8px; border: 1px solid var(--hair); background: var(--ground); }
    #chart svg { display: block; width: 100%; height: 90px; }
    #chart polygon { fill: rgba(190, 194, 199, 0.12); }
    #chart polyline { fill: none; stroke: var(--white); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    #chart dl { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; padding: 6px 7px; border-top: 1px solid var(--hair); }
    #chart dd { margin: 0; font: 13px var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    #chart dt { grid-row: 1; }
    #log { list-style: none; margin: 0; padding: 0; }
    #log li { padding: 5px 7px; border-left: 2px solid var(--muted); margin-bottom: 3px; background: var(--panel2); font-size: 12.5px; }
    #log li.ok { border-color: var(--good); }
    #log li.warn { border-color: var(--warn); background: rgba(184, 134, 11, 0.14); }
    #log li.bad { border-color: var(--bad); background: rgba(184, 86, 74, 0.15); }
    #log b { display: block; }
    #log span { font-family: var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    @media (max-width: 700px) {
      #map { inset: 0 0 45vh 0; }
      #panel { inset: auto 0 0 0; width: 100%; height: 45vh; border-right: 0; border-top: 1px solid var(--hair); padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>
  <aside id="panel">
    <h1>mbrt</h1>
    <span class="sub">chat to a map · gpt-oss-120b on Groq</span>
    <form id="chat" autocomplete="off">
      <label><span>ask</span><input id="msg" placeholder="30 min drive from Koramangala" maxlength="500"></label>
    </form>
    <span class="sub or">or pick a tool by hand</span>
    <form id="form" autocomplete="off">
      <label><span>tool</span><select id="tool"></select></label>
      <p id="desc"></p>
      <fieldset id="fields" style="border:0;margin:0;padding:0"></fieldset>
      <div class="row"><button id="run" type="submit">Run</button><button id="clear" type="button">Clear</button></div>
    </form>
    <pre id="call"></pre>
    <div id="chart" hidden></div>
    <ol id="log"></ol>
  </aside>
  <div id="map"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
